# ──────────────────────────────────────────────────────────────────
# Doctor Appointment System — GitHub Actions CI
# Ant project: compile → package WAR → upload artifact
# No external server required (all JARs bundled in lib/)
# ──────────────────────────────────────────────────────────────────

name: Java CI with Ant

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Fix Node.js 20 deprecation warning on GitHub-hosted runners
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────
      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'   # caches ~/.gradle; harmless when unused

      # ── 3. Verify Ant ──────────────────────────────────────────────
      - name: Print Ant & Java version
        run: |
          ant -version
          java -version

      # ── 4. Compile ─────────────────────────────────────────────────
      - name: Compile Java sources
        run: ant -noinput compile

      # ── 5. Package ─────────────────────────────────────────────────
      - name: Package WAR
        run: ant -noinput war

      # ── 6. Upload artefact ─────────────────────────────────────────
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doctor-Appointment-System-WAR
          path: dist/Doctor-Appointment-System.war
          retention-days: 30
          if-no-files-found: error
