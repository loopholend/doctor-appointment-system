# CI: Build Doctor Appointment System with Ant
# Requires no external server — all JARs are bundled in lib/

name: Java CI with Ant

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Compile with Ant
        run: ant compile

      - name: Package WAR with Ant
        run: ant war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doctor-Appointment-System-WAR
          path: dist/Doctor-Appointment-System.war
